<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Anuncios — Sistema Eco-Boutique 360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0F1714',
                        light: '#FDFBF7',
                        accent: '#E07A5F',
                        gold: '#D4AF37',
                        lightgold: '#FDE08B'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0f0d;
            color: #FDFBF7;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f0d;
        }
        ::-webkit-scrollbar-thumb {
            background: #202b26;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #E07A5F;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- SIDEBAR DE CONTROLES -->
    <div class="w-full md:w-96 bg-[#0F1714] border-r border-white/10 p-6 flex flex-col justify-between overflow-y-auto md:h-screen">
        <div class="space-y-6">
            <div>
                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-gold to-lightgold">
                    FÁBRICA DE ADS
                </h1>
                <p class="text-xs text-gray-400 mt-1">Generador de Banners HTML5 — ADN Alma</p>
            </div>
            
            <hr class="border-white/5">

            <!-- Selección de Ángulo -->
            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-accent">1. Ángulo de Venta</label>
                <select id="angleSelect" class="w-full bg-[#1b2722] border border-white/10 rounded-xl p-3 text-sm focus:border-accent outline-none text-white transition-all">
                    <option value="dolor">Ángulo A: Dolor (Evitación)</option>
                    <option value="beneficio" selected>Ángulo B: Beneficio (Transformación)</option>
                    <option value="curiosidad">Ángulo C: Curiosidad (Secreto)</option>
                </select>
            </div>

            <!-- Selección de Formato -->
            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-accent">2. Formato del Banner</label>
                <div class="grid grid-cols-2 gap-3">
                    <button id="btnSquare" class="py-2 px-3 bg-accent text-white border border-accent rounded-xl text-sm font-semibold transition-all">
                        Square (1:1)
                    </button>
                    <button id="btnStories" class="py-2 px-3 bg-transparent text-gray-300 border border-white/10 rounded-xl text-sm font-semibold hover:bg-white/5 transition-all">
                        Stories (9:16)
                    </button>
                </div>
            </div>

            <hr class="border-white/5">

            <!-- Edición de Texto -->
            <div class="space-y-4">
                <label class="block text-xs font-bold uppercase tracking-wider text-accent">3. Personalizar Textos</label>
                
                <div class="space-y-1">
                    <label class="text-xs text-gray-400">Texto Gancho (Hook)</label>
                    <textarea id="textHook" rows="2" class="w-full bg-[#1b2722] border border-white/10 rounded-xl p-3 text-sm focus:border-accent outline-none text-white transition-all" placeholder="Escribe el gancho aquí..."></textarea>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-400">Texto Secundario (Promesa)</label>
                    <textarea id="textSub" rows="3" class="w-full bg-[#1b2722] border border-white/10 rounded-xl p-3 text-sm focus:border-accent outline-none text-white transition-all" placeholder="Escribe el subtexto aquí..."></textarea>
                </div>
            </div>

            <hr class="border-white/5">

            <!-- Configuración del CTA -->
            <div class="space-y-4">
                <label class="block text-xs font-bold uppercase tracking-wider text-accent">4. Llamado a la Acción (CTA)</label>
                
                <div class="flex items-center justify-between">
                    <span class="text-xs text-gray-400">Mostrar Botón CTA</span>
                    <input type="checkbox" id="toggleCta" checked class="w-4 h-4 accent-accent rounded cursor-pointer">
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-400">Texto del Botón</label>
                    <input type="text" id="ctaText" class="w-full bg-[#1b2722] border border-white/10 rounded-xl p-3 text-sm focus:border-accent outline-none text-white transition-all" value="VER MÉTODO">
                </div>
                
                <div class="space-y-1">
                    <label class="text-xs text-gray-400">Color del Botón</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setCtaColor('#E07A5F')" class="h-8 rounded bg-accent border border-white/10 hover:scale-105 transition-transform"></button>
                        <button onclick="setCtaColor('#D4AF37')" class="h-8 rounded bg-gold border border-white/10 hover:scale-105 transition-transform"></button>
                        <button onclick="setCtaColor('rgba(255,255,255,0.08)')" class="h-8 rounded bg-white/10 border border-white/20 hover:scale-105 transition-transform text-[10px] font-bold">GLASS</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8">
            <button id="btnExport" class="w-full bg-gradient-to-r from-accent to-[#c96c53] hover:from-[#c96c53] hover:to-[#b5583f] text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 active:translate-y-0 text-sm flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                DESCARGAR BANNER
            </button>
        </div>
    </div>

    <!-- AREA DE PREVIEW -->
    <div class="flex-1 flex items-center justify-center p-6 bg-[#080b09] overflow-auto min-h-[500px]">
        
        <!-- Contenedor del Canvas Preview con ADN Alma -->
        <div id="adCanvas" class="relative overflow-hidden shadow-2xl rounded-2xl border border-white/10 transition-all bg-dark flex flex-col justify-end" style="width: 500px; height: 500px;">
            
            <!-- Imagen de Fondo Dinámica -->
            <img id="bgImg" src="assets/ad_bg_beneficio.webp" alt="Ad Background" class="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none">
            
            <!-- Degradado Overlay Gradiente ADN Alma (para asegurar legibilidad de textos) -->
            <div id="overlay" class="absolute inset-0 bg-gradient-to-t from-dark/95 via-dark/65 to-transparent z-10"></div>
            
            <!-- Brillo Ambiental Glow (Opcional del ADN) -->
            <div class="absolute -top-10 -left-10 w-64 h-64 bg-accent/15 rounded-full blur-[100px] z-10 pointer-events-none"></div>
            
            <!-- Contenido del Banner (Textos y CTAs) -->
            <div class="relative z-20 p-8 space-y-6 flex flex-col justify-end h-full">
                
                <!-- Badge Superior -->
                <div class="self-start">
                    <span id="badge" class="bg-accent/20 border border-accent/40 text-accent text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest">
                        Eco-Boutique 360
                    </span>
                </div>

                <!-- Textos del Copy -->
                <div class="space-y-3">
                    <h2 id="previewHook" class="text-3xl font-black leading-tight text-white tracking-tight">
                        Tu Cocina. Tu Propio Estudio Aromático Lujoso.
                    </h2>
                    <p id="previewSub" class="text-base text-gray-300 font-light leading-relaxed">
                        Crea velas y jabones botánicos premium que tus clientes desearán en Instagram. Únete por solo $37.50 USD hoy.
                    </p>
                </div>

                <!-- Botón CTA Falso -->
                <div id="ctaContainer" class="flex items-center justify-between border-t border-white/10 pt-4 mt-2">
                    <span class="text-xs text-gray-400 uppercase tracking-widest">Últimos Cupos 3x1</span>
                    <div id="previewCta" class="px-6 py-3 rounded-xl font-black text-sm tracking-wider shadow-lg transition-transform" style="background-color: #E07A5F; color: white;">
                        VER MÉTODO
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE INTERACTIVIDAD -->
    <script>
        // Datos de Copys de los 3 Ángulos
        const copys = {
            dolor: {
                bg: 'assets/ad_bg_dolor.webp',
                badge: 'Evita Fracasar',
                hook: '¿Haciendo velas que nadie te compra?',
                sub: 'Deja de competir por centavos vendiendo velas baratas de $3 USD. Aprende el método de lujo en 14 días.',
                cta: 'VER MÉTODO',
                ctaBg: '#E07A5F'
            },
            beneficio: {
                bg: 'assets/ad_bg_beneficio.webp',
                badge: 'Eco-Boutique 360',
                hook: 'Tu Cocina. Tu Propio Estudio Aromático Lujoso.',
                sub: 'Crea velas y jabones botánicos premium que tus clientes desearán en Instagram. Únete por solo $37.50 USD hoy.',
                cta: 'EMPEZAR HOY',
                ctaBg: '#D4AF37'
            },
            curiosidad: {
                bg: 'assets/ad_bg_curiosidad.webp',
                badge: 'Fórmula Secreta',
                hook: '¿El ingrediente secreto de las velas de $35 USD?',
                sub: 'No está en la cera... descubre el Código Sensorial que detiene el scroll de cualquiera. 3 Bonos Incluidos.',
                cta: 'DESCUBRIR SECRETO',
                ctaBg: 'rgba(255,255,255,0.08)'
            }
        };

        // Elementos DOM
        const angleSelect = document.getElementById('angleSelect');
        const btnSquare = document.getElementById('btnSquare');
        const btnStories = document.getElementById('btnStories');
        const textHook = document.getElementById('textHook');
        const textSub = document.getElementById('textSub');
        const toggleCta = document.getElementById('toggleCta');
        const ctaText = document.getElementById('ctaText');
        const btnExport = document.getElementById('btnExport');
        
        // Elementos del Canvas Preview
        const adCanvas = document.getElementById('adCanvas');
        const bgImg = document.getElementById('bgImg');
        const badge = document.getElementById('badge');
        const previewHook = document.getElementById('previewHook');
        const previewSub = document.getElementById('previewSub');
        const previewCta = document.getElementById('previewCta');
        const ctaContainer = document.getElementById('ctaContainer');

        let currentCtaBg = '#E07A5F';

        // Inicialización
        function init() {
            updateContent('beneficio');
        }

        // Cambiar contenido basado en el ángulo seleccionado
        function updateContent(angleKey) {
            const copy = copys[angleKey];
            bgImg.src = copy.bg;
            badge.innerText = copy.badge;
            textHook.value = copy.hook;
            textSub.value = copy.sub;
            ctaText.value = copy.cta;
            
            previewHook.innerText = copy.hook;
            previewSub.innerText = copy.sub;
            previewCta.innerText = copy.cta;
            
            setCtaColor(copy.ctaBg);
        }

        // Event Listeners
        angleSelect.addEventListener('change', (e) => {
            updateContent(e.target.value);
        });

        textHook.addEventListener('input', (e) => {
            previewHook.innerText = e.target.value;
        });

        textSub.addEventListener('input', (e) => {
            previewSub.innerText = e.target.value;
        });

        ctaText.addEventListener('input', (e) => {
            previewCta.innerText = e.target.value;
        });

        toggleCta.addEventListener('change', (e) => {
            if (e.target.checked) {
                ctaContainer.style.display = 'flex';
            } else {
                ctaContainer.style.display = 'none';
            }
        });

        // Configuración de Color del CTA
        function setCtaColor(color) {
            currentCtaBg = color;
            previewCta.style.backgroundColor = color;
            
            if (color.startsWith('rgba') || color === 'transparent') {
                previewCta.style.border = '1px solid rgba(255,255,255,0.2)';
                previewCta.style.backdropFilter = 'blur(12px)';
                previewCta.style.color = '#FDFBF7';
            } else {
                previewCta.style.border = 'none';
                previewCta.style.backdropFilter = 'none';
                previewCta.style.color = color === '#D4AF37' ? '#0F1714' : '#FDFBF7';
            }
        }

        // Formatos de Banner
        btnSquare.addEventListener('click', () => {
            adCanvas.style.width = '500px';
            adCanvas.style.height = '500px';
            btnSquare.className = "py-2 px-3 bg-accent text-white border border-accent rounded-xl text-sm font-semibold transition-all";
            btnStories.className = "py-2 px-3 bg-transparent text-gray-300 border border-white/10 rounded-xl text-sm font-semibold hover:bg-white/5 transition-all";
        });

        btnStories.addEventListener('click', () => {
            adCanvas.style.width = '350px';
            adCanvas.style.height = '622px'; // Mantiene proporción 9:16 compactada en preview
            btnStories.className = "py-2 px-3 bg-accent text-white border border-accent rounded-xl text-sm font-semibold transition-all";
            btnSquare.className = "py-2 px-3 bg-transparent text-gray-300 border border-white/10 rounded-xl text-sm font-semibold hover:bg-white/5 transition-all";
        });

        // Exportar a PNG usando html2canvas
        btnExport.addEventListener('click', () => {
            btnExport.innerText = 'PROCESANDO...';
            btnExport.disabled = true;

            // Esperar que las fuentes se carguen bien
            document.fonts.ready.then(() => {
                // Obtenemos las dimensiones reales del lienzo
                const isSquare = adCanvas.style.width === '500px';
                
                // Forzar escala para alta definición al exportar
                const exportOptions = {
                    scale: 2, // Exporta a 2x de resolución (ideal para Meta Ads)
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#0F1714'
                };

                html2canvas(adCanvas, exportOptions).then(canvas => {
                    const link = document.createElement('a');
                    const formatName = isSquare ? '1080x1080' : '1080x1920';
                    const angleName = angleSelect.value;
                    
                    link.download = `ad_${angleName}_${formatName}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    btnExport.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> DESCARGAR BANNER`;
                    btnExport.disabled = false;
                }).catch(err => {
                    console.error('Error exportando canvas:', err);
                    alert('Ocurrió un error al procesar el banner. Inténtalo de nuevo.');
                    btnExport.innerHTML = `DESCARGAR BANNER`;
                    btnExport.disabled = false;
                });
            });
        });

        // Ejecutar inicialización al cargar
        init();
    </script>
</body>
</html>
