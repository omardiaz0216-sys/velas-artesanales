<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fábrica de Creativos Meta Ads | Eco-Boutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0F1714',
                        light: '#FDFBF7',
                        accent: '#E07A5F',
                        gold: '#D4AF37'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap');
        
        /* Banner es de 1080x1080 pero lo escalamos visualmente */
        #banner-container {
            width: 1080px;
            height: 1080px;
            transform: scale(0.4);
            transform-origin: top left;
            position: relative;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        
        /* Contenedor wrapper para compensar el scale */
        .banner-wrapper {
            width: 432px; /* 1080 * 0.4 */
            height: 432px;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- PANEL DE CONTROL -->
        <div class="w-full md:w-1/3 bg-gray-50 p-8 border-r border-gray-200">
            <h2 class="text-2xl font-bold mb-6 text-dark">Creador de Anuncios (1:1)</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Imagen de Fondo</label>
                    <select id="bg-selector" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-accent focus:border-accent" onchange="updateBanner()">
                        <option value="assets/ad_bg_dolor.jpg">Dolor (Mesa sucia, estrés)</option>
                        <option value="assets/ad_bg_beneficio.jpg">Beneficio (Productos luxury)</option>
                        <option value="assets/ad_bg_curiosidad.jpg">Curiosidad (Caja misteriosa)</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Titular (Headline)</label>
                    <textarea id="input-headline" rows="3" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-accent focus:border-accent" oninput="updateBanner()">Deja de perder dinero en cera barata.</textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Subtítulo (Opcional)</label>
                    <input type="text" id="input-sub" value="El secreto de las Micro-Marcas rentables" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-accent focus:border-accent" oninput="updateBanner()">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Color del Texto Primario</label>
                    <select id="color-selector" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-accent focus:border-accent" onchange="updateBanner()">
                        <option value="text-white">Blanco</option>
                        <option value="text-accent">Terracota (#E07A5F)</option>
                        <option value="text-gold">Dorado (#D4AF37)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Texto del Botón Falso</label>
                    <input type="text" id="input-cta" value="Más Información" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-accent focus:border-accent" oninput="updateBanner()">
                </div>

                <div class="pt-6 border-t border-gray-200">
                    <button onclick="downloadBanner()" class="w-full bg-dark hover:bg-black text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-transform hover:-translate-y-1">
                        ⬇️ Descargar Banner (.png)
                    </button>
                    <p class="text-xs text-center text-gray-500 mt-2">1080x1080px (Ideal para Instagram/Facebook Feed)</p>
                </div>
            </div>
        </div>

        <!-- PREVISUALIZACIÓN -->
        <div class="w-full md:w-2/3 p-8 flex items-center justify-center bg-gray-200">
            <div class="banner-wrapper shadow-2xl">
                <!-- BANNER REAL (1080x1080) -->
                <div id="banner-container" style="background-image: url('assets/ad_bg_dolor.jpg');">
                    <!-- Overlay degradado oscuro para que resalte el texto -->
                    <div class="absolute inset-0 bg-gradient-to-t from-dark/90 via-dark/40 to-transparent"></div>
                    
                    <!-- Contenido -->
                    <div class="absolute bottom-0 left-0 right-0 p-16 flex flex-col justify-end h-full">
                        <div class="max-w-3xl">
                            <h1 id="banner-headline" class="text-7xl font-extrabold mb-6 leading-tight text-white drop-shadow-2xl">
                                Deja de perder dinero en cera barata.
                            </h1>
                            <p id="banner-sub" class="text-3xl font-medium text-gray-200 mb-10 drop-shadow-md">
                                El secreto de las Micro-Marcas rentables
                            </p>
                            <div class="inline-block bg-accent text-white font-bold text-3xl py-5 px-10 rounded-full shadow-[0_10px_30px_rgba(224,122,95,0.5)]">
                                <span id="banner-cta">Más Información</span> &rarr;
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateBanner() {
            // Fondo
            const bgSelect = document.getElementById('bg-selector').value;
            document.getElementById('banner-container').style.backgroundImage = `url('${bgSelect}')`;
            
            // Textos
            document.getElementById('banner-headline').innerText = document.getElementById('input-headline').value;
            document.getElementById('banner-sub').innerText = document.getElementById('input-sub').value;
            document.getElementById('banner-cta').innerText = document.getElementById('input-cta').value;
            
            // Colores Headline
            const colorClass = document.getElementById('color-selector').value;
            const headline = document.getElementById('banner-headline');
            headline.className = `text-7xl font-extrabold mb-6 leading-tight drop-shadow-2xl ${colorClass}`;
        }

        function downloadBanner() {
            const container = document.getElementById('banner-container');
            // Quitamos el scale momentáneamente para que html2canvas renderice full size
            container.style.transform = 'none';
            
            html2canvas(container, {
                scale: 1, 
                useCORS: true,
                backgroundColor: null,
                width: 1080,
                height: 1080
            }).then(canvas => {
                // Volvemos a poner el scale para la vista UI
                container.style.transform = 'scale(0.4)';
                
                const link = document.createElement('a');
                link.download = 'eco_boutique_ad.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // Init
        updateBanner();
    </script>
</body>
</html>
